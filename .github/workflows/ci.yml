name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install the CI-tested dependency set. constraints.txt pins exact
      # versions — critically mcp==1.27, because the code targets mcp v1's
      # `mcp.server.fastmcp.FastMCP`, which 2.x renamed/removed. [gcp] brings
      # google-genai for the default Gemini backend (its tests import
      # `google.genai`); without it the TestGeminiResponseShapes suite fails
      # with ModuleNotFoundError: No module named 'google'.
      - name: Install SeeQL (all extras, pinned to constraints.txt)
        run: pip install -e ".[dev,api,mcp,openai,gcp]" -c constraints.txt

      # Prints the fully-resolved version set so a security bump that unpins
      # a package in constraints.txt can be re-pinned to whatever CI resolved.
      - name: Resolved versions (pip freeze)
        run: pip freeze --exclude-editable

      # advisory until the pre-existing lint debt is cleared in a follow-up;
      # flip to a hard gate then.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Test
        run: pytest -q

# Publishes the built sdist/wheel to PyPI using OIDC Trusted Publishing —
# no API token is stored in this repo. This requires:
#   1. A GitHub Environment named `pypi` (Settings → Environments).
#   2. A PyPI trusted-publisher config for this repo/workflow/environment
#      (PyPI → project → Publishing, or a "pending publisher" if the
#      `seeql` project doesn't exist on PyPI yet).
# See docs/... (or the PR description) for the full one-time setup steps.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
